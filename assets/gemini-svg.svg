<!-- Save this file as header-banner.svg in your repository (e.g. assets/header-banner.svg) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient (Deep Navy to Clinical Teal/Green) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="45%" stop-color="#102a45"/>
      <stop offset="85%" stop-color="#0d3b4c"/>
      <stop offset="100%" stop-color="#082b38"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00A896" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#028090" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05668D" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#02C39A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00C9A7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glowing ECG Pulse Gradient -->
    <linearGradient id="ecgGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007ACC" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#00C9A7"/>
      <stop offset="55%" stop-color="#48CAE4"/>
      <stop offset="70%" stop-color="#02C39A"/>
      <stop offset="100%" stop-color="#007ACC" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .track-title {
      font-family: Calibri, 'Segoe UI', Candara, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #00E5BE;
      text-transform: uppercase;
      animation: fadeInDown 1.2s ease-out forwards;
    }

    .main-title {
      font-family: Calibri, 'Segoe UI', Candara, -apple-system, sans-serif;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: #FFFFFF;
      animation: fadeIn 1.5s ease-out forwards;
    }

    .main-title-accent {
      fill: #00E5BE;
    }

    .subtitle {
      font-family: Calibri, 'Segoe UI', Candara, -apple-system, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #A0C4D9;
      letter-spacing: 0.8px;
    }

    /* Wave animations */
    .wave-back {
      animation: floatWaveBack 10s ease-in-out infinite alternate;
    }
    .wave-front {
      animation: floatWaveFront 7s ease-in-out infinite alternate;
    }

    @keyframes floatWaveBack {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(12px) scaleY(1.08); }
    }

    @keyframes floatWaveFront {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(-10px) scaleY(0.94); }
    }

    /* ECG Vital Rhythm Animation */
    .ecg-path {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawECG 4s linear infinite;
    }

    @keyframes drawECG {
      0% { stroke-dashoffset: 1200; opacity: 0.2; }
      15% { opacity: 1; }
      80% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    /* Pulse Dot Beacon */
    .pulse-dot {
      animation: beaconPulse 2s infinite ease-out;
    }

    @keyframes beaconPulse {
      0% { r: 4px; opacity: 1; }
      70% { r: 12px; opacity: 0; }
      100% { r: 14px; opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />

  <!-- Background Tech Grid Pattern -->
  <g opacity="0.08" stroke="#00C9A7" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Glowing Animated ECG Pulse Line behind text -->
  <path class="ecg-path" 
        d="M 50,225 L 340,225 L 355,200 L 370,250 L 385,150 L 405,285 L 420,215 L 435,230 L 450,225 L 750,225 L 765,205 L 780,245 L 795,160 L 815,280 L 830,225 L 1150,225" 
        fill="none" 
        stroke="url(#ecgGlow)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowEffect)" />

  <!-- Animated Bottom Waves (matching reference curved waves) -->
  <path class="wave-back"
        d="M 0,310 C 260,370 540,280 820,330 C 990,360 1110,330 1200,315 L 1200,420 L 0,420 Z" 
        fill="url(#waveEmeraldGrad)" />

  <path class="wave-front"
        d="M 0,340 C 220,290 520,370 800,320 C 1000,285 1130,340 1200,355 L 1200,420 L 0,420 Z" 
        fill="url(#waveCyanGrad)" />

  <!-- Top Metadata Track -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <rect x="-310" y="-22" width="620" height="34" rx="17" fill="#031E2A" fill-opacity="0.8" stroke="#00A896" stroke-width="1.2"/>
    <text class="track-title" y="0" text-anchor="middle">
      PROJECT P_025  •  BUSINESS ANALYTICS  •  HEALTHCARE &amp; PHARMA
    </text>
  </g>

  <!-- Center Main Heading -->
  <g transform="translate(600, 168)" text-anchor="middle" filter="url(#softShadow)">
    <text class="main-title" text-anchor="middle">
      Patient Health Outcome <tspan class="main-title-accent">Predictor</tspan>
    </text>
  </g>

  <!-- Center Subtitle / Tagline -->
  <text class="subtitle" x="600" y="215" text-anchor="middle">
    Predictive Clinical Intelligence &amp; 30-Day Readmission Risk Stratification
  </text>

  <!-- Pulse Status Indicator Pill (Bottom Floating) -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <rect x="-175" y="-16" width="350" height="32" rx="16" fill="#072338" fill-opacity="0.9" stroke="#00E5BE" stroke-width="1.2"/>
    
    <!-- Radar pulsing beacon -->
    <circle cx="-145" cy="0" r="4" fill="#00E5BE"/>
    <circle class="pulse-dot" cx="-145" cy="0" r="6" fill="none" stroke="#00E5BE" stroke-width="1.5"/>

    <text x="10" y="5" font-family="Calibri, 'Segoe UI', Candara, sans-serif" font-size="14" font-weight="700" fill="#E0F7FA" letter-spacing="1.2" text-anchor="middle">
      ML PIPELINE  |  SHAP XAI  |  PLOTLY
    </text>
  </g>

  <!-- Modern Corner Accent Border -->
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#00E5BE" stroke-width="1.5" stroke-opacity="0.35"/>
</svg>
